services:
  - type: web
    name: artive-ml
    runtime: python
    rootDir: ml
    plan: free
    buildCommand: pip install -r requirements.txt && python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
